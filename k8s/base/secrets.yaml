# k8s/base/secrets.yaml
# IMPORTANT: In production, use External Secrets Operator or Nebius Secret Manager
# This is a placeholder - NEVER commit real secrets to git
apiVersion: v1
kind: Secret
metadata:
  name: nebius-api-credentials
  namespace: pipeline-ai
  annotations:
    kubed.appscode.com/sync: "pipeline-ai=pipeline-ai"
type: Opaque
stringData:
  NEBIUS_API_KEY: "${NEBIUS_API_KEY}"  # Injected by Terraform/CI
  SAP_AUTH_TOKEN: "${SAP_AUTH_TOKEN}"
  SAP_API_URL: "${SAP_API_URL}"
---
# mTLS Certificates (managed by cert-manager in production)
apiVersion: v1
kind: Secret
metadata:
  name: mqtt-tls-certs
  namespace: pipeline-ai
type: kubernetes.io/tls
stringData:
  ca.crt: "${MQTT_CA_CERT}"
  tls.crt: "${MQTT_SERVER_CERT}"
  tls.key: "${MQTT_SERVER_KEY}"