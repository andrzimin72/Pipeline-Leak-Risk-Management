# Production overrides
global:
  domain: exxonmobil.nebius.cloud

api:
  replicaCount: 5
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi
  autoscaling:
    minReplicas: 5
    maxReplicas: 50

mosquitto:
  replicaCount: 5
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
  persistence:
    size: 100Gi

monitoring:
  prometheus:
    retention: 90d
    storageSize: 500Gi