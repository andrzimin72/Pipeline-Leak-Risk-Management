apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mosquitto.fullname" . }}
  namespace: {{ .Values.global.namespace }}
spec:
  serviceName: {{ include "mosquitto.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mosquitto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mosquitto.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        fsGroup: 1883
      containers:
      - name: mosquitto
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.service.mqttPort }}
          name: mqtt-tls
        - containerPort: {{ .Values.service.websocketPort }}
          name: websocket
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          tcpSocket:
            port: mqtt-tls
          initialDelaySeconds: 10
        livenessProbe:
          tcpSocket:
            port: mqtt-tls
          initialDelaySeconds: 30
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config
        - name: certs
          mountPath: /mosquitto/certs
          readOnly: true
        - name: data
          mountPath: /mosquitto/data
      volumes:
      - name: config
        configMap:
          name: {{ include "mosquitto.fullname" . }}-config
      - name: certs
        secret:
          secretName: mqtt-tls-certs
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.global.storageClass }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}